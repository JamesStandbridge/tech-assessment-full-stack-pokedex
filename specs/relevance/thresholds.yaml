# Relevance targets checked by the evaluation run. Metrics are computed per
# query and per judged kind, on the results of that kind in ranked order.
#
# Calibrated on the judged queries (tooling/tests/unit/test_threshold_calibration.py):
#   ranking                         mean nDCG   share of pairs >= 0.80
#   ideal                           1.00        100%
#   top two swapped                 0.94        93%
#   best result moved to rank 5     0.90        79%
#   one irrelevant first result     0.73        0%
#   naive substring full-text       0.55        32%
#   naive whole-word full-text      0.42        29%
# The per-query minimum rejects any irrelevant first result; the mean minimum
# tolerates occasional ordering slips but rejects systematic ones.

schema_version: 1

cutoff: 10

metrics:
  ndcg:
    description: Normalized discounted cumulative gain at the cutoff, with gain 2^grade - 1.
    per_query_minimum: 0.80
    mean_minimum: 0.90
  reciprocal_rank:
    description: Inverse rank of the first result with the highest judged grade.
    per_query_minimum: 1.0
    applies_to_needs: [name-recovery]

# Pre-registered on 2026-09-29, before any assessor grading and before any
# implementation of the search service. Do not change after seeing results.
assessor:
  ndcg_mean_minimum: 0.80

