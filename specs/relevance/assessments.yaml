# Blind assessment sheet, generated by pool-assessments. Edit grades only;
# rerun pool-assessments to add candidates. See docs/adr/0007.
schema_version: 1
instructions: Grade every candidate from 0 to 3 for the query alone, as a trainer asking it would. Candidates
  are shuffled and come from several rankers; ignore their order. Replace each null grade with a number.
  To add a query of your own, append an entry with an id such as Q-USER-01, the query and an empty candidate
  list, then run pool-assessments again.
grades:
  '0': Not useful for this query.
  '1': Marginally useful, or useful with a caveat.
  '2': Useful.
  '3': Exactly what the query asks for.
