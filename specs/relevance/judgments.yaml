      move: {spore: 3, sleep-powder: 3, lovely-kiss: 3, hypnosis: 2, sing: 2}
      ability: {effect-spore: 1}
      pokemon:
        bulbasaur: 2
        ivysaur: 2
        venusaur: 2
        butterfree: 2
