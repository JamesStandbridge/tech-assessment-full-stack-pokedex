  - id: Q-INTENT-03
    need: intent-discovery
    query: confuse the opponent
    grading_rule: Guaranteed confusion with accuracy of 100 is 3, below 100 is 2; a chance is 1.
    judgments:
      move: {confuse-ray: 3, supersonic: 2, dizzy-punch: 1, psybeam: 1, confusion: 1}

  - id: Q-STRAT-01
    need: strategy-exploration
    query: rain team
    grading_rule: >
      Roles are judged for rain only: what an effect does in another weather
      does not count. Abilities that benefit from rain are 3, an ability that
      cancels weather is 1. A move that improves in rain is 3, a move weakened
      by rain is 1. Pokémon with a rain ability that also learn thunder are 3,
      other holders of a rain ability are 2.
    judgments:
      ability: {swift-swim: 3, rain-dish: 3, hydration: 3, dry-skin: 3, cloud-nine: 1}
      move: {thunder: 3, solar-beam: 1}
      pokemon: &rain_pokemon
        lapras: 3
        squirtle: 2
        wartortle: 2
        blastoise: 2
        psyduck: 2
        golduck: 2
        poliwag: 2
        poliwhirl: 2
        poliwrath: 2
        tentacool: 2
        tentacruel: 2
        seel: 2
        dewgong: 2
        horsea: 2
        goldeen: 2
        seaking: 2
        magikarp: 2
        vaporeon: 2
        omanyte: 2
        omastar: 2
        kabuto: 2
        kabutops: 2
        paras: 2
        parasect: 2
        jynx: 2

  - id: Q-STRAT-02
    need: strategy-exploration
    query: pokemon that benefit from rain
    grading_rule: Same Pokémon grades as Q-STRAT-01.
    judgments:
      pokemon: *rain_pokemon

  - id: Q-STRAT-03
    need: strategy-exploration
    query: sun team
    grading_rule: >
      Roles are judged for sun only. The sun setter and abilities that benefit
      from sun are 3, a conditional effect is 2, an ability hurt by sun or
      cancelling weather is 1. Moves improved by sun are 3, a move weakened by
      sun is 1. Holders of the sun setter are 3, holders of another sun ability
      are 2.
    judgments:
      ability:
        drought: 3
        chlorophyll: 3
        solar-power: 3
        leaf-guard: 2
        harvest: 2
        dry-skin: 1
        cloud-nine: 1
      move: {solar-beam: 3, growth: 3, thunder: 1}
      pokemon:
        vulpix: 3
        ninetales: 3
        bulbasaur: 2
        ivysaur: 2
        venusaur: 2
        charmander: 2
        charmeleon: 2
        charizard: 2
        oddish: 2
        gloom: 2
        vileplume: 2
        bellsprout: 2
        weepinbell: 2
        victreebel: 2
        exeggcute: 2
        exeggutor: 2
        tangela: 2

  - id: Q-STRAT-04
    need: strategy-exploration
    query: sandstorm team
    grading_rule: >
      Abilities that benefit from sandstorm are 3, weather protection or cancel
      is 1. A move weakened by sandstorm is 1. Pokémon with two sandstorm
      abilities are 3, with one are 2.
    judgments:
      ability: {sand-veil: 3, sand-rush: 3, sand-force: 3, overcoat: 1, magic-guard: 1, cloud-nine: 1}
      move: {solar-beam: 1}
      pokemon:
        sandshrew: 3
        sandslash: 3
        diglett: 3
        dugtrio: 3
        geodude: 2
        graveler: 2
        golem: 2
