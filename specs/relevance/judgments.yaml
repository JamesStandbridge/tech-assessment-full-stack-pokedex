# Graded relevance judgments, in the style of TREC qrels.
# Grades are judged per entity kind, because ranking is compared within a kind.
# An entity that is not listed has grade 0. A kind that is not listed for a
# query is not evaluated for that query. Hard negatives live in the Gherkin
# scenarios, not here.

schema_version: 1

grades:
  "3": The answer the user is looking for.
  "2": Relevant and useful.
  "1": Acceptable, usually with a caveat shown to the user.

queries:
  - id: Q-NAME-01
    need: name-recovery
    query: bulba
    grading_rule: The matched Pokémon is 3; its evolution family is 1.
    judgments:
      pokemon: {bulbasaur: 3, ivysaur: 1, venusaur: 1}

  - id: Q-NAME-02
    need: name-recovery
    query: mew
    grading_rule: The exact name is 3; a longer name sharing the prefix is 2.
    judgments:
      pokemon: {mew: 3, mewtwo: 2}

  - id: Q-NAME-03
    need: name-recovery
    query: abra
    grading_rule: The exact name is 3; a name containing the query is 2; its evolution family is 1.
    judgments:
      pokemon: {abra: 3, kadabra: 2, alakazam: 1}

  - id: Q-NAME-04
    need: name-recovery
    query: char
    grading_rule: Every name starting with the query is 3.
    judgments:
      pokemon: {charmander: 3, charmeleon: 3, charizard: 3}

  - id: Q-NAME-05
    need: name-recovery
    query: saur
    grading_rule: Every name containing the query is 3.
    judgments:
      pokemon: {bulbasaur: 3, ivysaur: 3, venusaur: 3}

  - id: Q-NAME-06
    need: name-recovery
    query: thunder
    grading_rule: The exact move is 3; moves whose names contain the query are 2.
    judgments:
      move: {thunder: 3, thunderbolt: 2, thunder-shock: 2, thunder-punch: 2, thunder-wave: 2}

  - id: Q-CRIT-01
    need: criteria-comparison
    query: fast electric pokemon
    grading_rule: Electric Pokémon by base speed; 120 or more is 3, 100 to 119 is 2, 70 to 99 is 1.
    judgments:
      pokemon:
        electrode: 3
        jolteon: 3
        raichu: 2
        electabuzz: 2
        voltorb: 2
        zapdos: 2
        pikachu: 1
        magneton: 1

  - id: Q-CRIT-02
    need: criteria-comparison
    query: slow fire pokemon
    grading_rule: The slowest Fire Pokémon is 3; speed 65 is 2; speed 66 to 89 is 1.
    judgments:
      pokemon: {growlithe: 3, charmander: 2, vulpix: 2, flareon: 2, charmeleon: 1}

  - id: Q-CRIT-03
    need: criteria-comparison
    query: fastest pokemon
    grading_rule: Base speed 130 or more is 3, 115 to 129 is 2, 100 to 114 is 1.
    judgments:
      pokemon:
