  - id: Q-INTENT-01
    need: intent-discovery
    query: put the opponent to sleep
    grading_rule: >
      Sleep moves with accuracy of 75 or more are 3, below 75 are 2. An ability
      with a chance to cause sleep on contact is 1. Pokémon learning a sleep move
      with accuracy of 75 or more are 2; Pokémon with only a less accurate sleep
      move are 1.
