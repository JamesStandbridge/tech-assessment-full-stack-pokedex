  - id: Q-INTENT-02
    need: intent-discovery
    query: paralyze the opponent
    grading_rule: Guaranteed paralysis is 3, a 30% chance is 2, a 10% or 20% chance is 1.
    judgments:
      move:
        thunder-wave: 3
        glare: 3
        stun-spore: 3
        body-slam: 2
        lick: 2
        thunder: 2
        thunder-punch: 1
        thunder-shock: 1
