        jolteon: 3
        aerodactyl: 3
        mewtwo: 3
        dugtrio: 2
        alakazam: 2
        persian: 2
        starmie: 2
        raichu: 1
        dodrio: 1
        gengar: 1
        tauros: 1
        kadabra: 1
        rapidash: 1
        scyther: 1
        electabuzz: 1
        pidgeot: 1
        charizard: 1
        fearow: 1
