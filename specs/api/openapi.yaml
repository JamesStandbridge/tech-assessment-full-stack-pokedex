openapi: 3.1.0
info:
  title: Pokédex Search API
  version: 0.5.0
  description: >
    Searches the published pokedex.json snapshot for Pokémon, moves and
    abilities. Results come in one ranked section per entity kind, every result
    says why it matched, and the response describes how the query was
    understood. Every GET resource also answers HEAD; responses above 1 kB are
    compressed when the client accepts gzip, and every response carries
    X-Content-Type-Options: nosniff.
paths:
  /api/search:
    get:
      operationId: search
      summary: Search the Pokédex
      parameters:
        - name: q
          in: query
          required: true
          description: Free-text query, trimmed, between 2 and 200 characters.
          schema:
            type: string
        - name: kind
          in: query
          required: false
          description: Restrict the response to the section of one entity kind. Required with a cursor.
          schema:
            $ref: "#/components/schemas/EntityKind"
        - name: limit
          in: query
          required: false
          description: Maximum number of results per section.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque next_cursor of a section, sent with the same q and the section's kind.
          schema:
            type: string
      responses:
        "200":
          description: The query is valid. The outcome says whether anything answers it.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: The query or a parameter breaks the input rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_query
                  message: The query must contain between 2 and 200 characters.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/suggest:
    get:
      operationId: suggest
      summary: Suggest entity names and vocabulary concepts while the user types
      parameters:
        - name: q
          in: query
          required: true
          description: Partial query, trimmed, between 2 and 200 characters.
          schema:
            type: string
      responses:
        "200":
          description: Suggestions, best first. The list may be empty.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestResponse"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: The partial query breaks the input rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/entities/{kind}/{name}:
    get:
      operationId: getEntity
      summary: Get one Pokémon, move or ability with its related entities
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EntityKind"
        - name: name
          in: path
          required: true
          description: Kebab-case dataset name.
          schema:
            type: string
      responses:
        "200":
          description: The entity and its relations.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityDetail"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          description: No entity of this kind has this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: not_found
                  message: No move is named 'rain-dance'.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/health:
    get:
      operationId: health
      summary: Report whether the dataset is loaded
      responses:
        "200":
          description: The service is ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, dataset_sha256]
                properties:
                  status:
                    type: string
                    const: ok
                  dataset_sha256:
                    type: string
components:
  headers:
    ETag:
      description: >
        Weak entity tag of the response body. Sending it back in If-None-Match
        yields 304 Not Modified while the response is unchanged.
      schema:
        type: string
    CacheControl:
      description: Always no-cache, so every reuse of a stored response is validated.
      schema:
        type: string
        const: no-cache
  responses:
    NotModified:
      description: The entity tag in If-None-Match still matches; the stored response is current.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
    InternalError:
      description: Unexpected failure. No internal detail is exposed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: internal_error
              message: The search failed unexpectedly.
  schemas:
    EntityKind:
      type: string
      enum: [pokemon, move, ability]
    EntityRef:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/EntityKind"
        name:
          type: string
    SearchResponse:
      type: object
      required:
        - query
        - canonical_query
        - outcome
        - interpretation
        - terms
        - notices
        - explanation
        - suggestions
        - best_match
        - refinements
        - sections
      properties:
        query:
          type: string
          description: The query after trimming.
        canonical_query:
          type: [string, "null"]
          description: >
            The query rewritten in the product vocabulary; it is interpreted
            exactly as the original. Null when no term was recognized.
        outcome:
          type: string
          enum: [results, empty]
        interpretation:
          $ref: "#/components/schemas/Interpretation"
        terms:
          type: array
          description: Every term of the query, in order, with the role it was recognized in.
          items:
            $ref: "#/components/schemas/Term"
        notices:
          type: array
          description: Honest caveats, such as ignored terms, an approximate match or a mechanic absent from the dataset.
          items:
            $ref: "#/components/schemas/Notice"
        explanation:
          type: [string, "null"]
          description: Why nothing answers the query. Required when the outcome is empty.
        suggestions:
          type: array
          description: Names close to the query and example queries, offered when the outcome is empty.
          items:
            $ref: "#/components/schemas/Suggestion"
        best_match:
          description: The entity the query names exactly, or the only name it is a prefix of.
          oneOf:
            - $ref: "#/components/schemas/EntityRef"
            - type: "null"
        refinements:
          type: array
          description: Ways to adjust each recognized constraint, each with the canonical query that applies it.
          items:
            $ref: "#/components/schemas/Refinement"
        sections:
          type: array
          description: One section per entity kind with results, most relevant kind first.
          items:
            $ref: "#/components/schemas/Section"
      allOf:
        - if:
            properties:
              outcome:
                const: empty
          then:
            properties:
              explanation:
                type: string
              sections:
                maxItems: 0
          else:
            properties:
              sections:
                minItems: 1
    Interpretation:
      type: object
      required: [alternatives, summary]
      properties:
        alternatives:
          type: array
          description: >
            Plans the query was read as. Each plan is conjunctive: its results
            satisfy all of its constraints. Several plans mean the query was
            ambiguous, such as psychic, a type and a move.
          items:
            $ref: "#/components/schemas/SearchPlan"
        summary:
          type: string
          description: Human-readable description of the plans, shown to the user.
    SearchPlan:
      type: object
      required:
        - kinds
        - name
        - dex_number
        - types
        - characteristics
        - stat_sort
        - stat_filters
        - damage_classes
        - effect
        - weather
        - relation
      properties:
        kinds:
          type: array
          description: Kinds the results are restricted to; empty means any kind a constraint applies to.
          items:
            $ref: "#/components/schemas/EntityKind"
        name:
          type: [string, "null"]
          description: Name term matched against entity names.
        dex_number:
          type: [integer, "null"]
          minimum: 1
        types:
          type: array
          items:
            type: string
        characteristics:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
        stat_sort:
          type: array
          description: Stats to rank by. One stat ranks by its value; several rank by their mean percentile.
          items:
            $ref: "#/components/schemas/StatSort"
        stat_filters:
          type: array
          description: Comparisons every result satisfies.
          items:
            $ref: "#/components/schemas/StatFilter"
        damage_classes:
          type: array
          description: Damage classes every move result has.
          items:
            type: string
            enum: [physical, special, status]
        effect:
          oneOf:
            - $ref: "#/components/schemas/EffectConstraint"
            - type: "null"
        weather:
          oneOf:
            - $ref: "#/components/schemas/WeatherConstraint"
            - type: "null"
        relation:
          oneOf:
            - $ref: "#/components/schemas/RelationConstraint"
            - type: "null"
    Characteristic:
      type: object
      required: [facet, value]
      properties:
        facet:
          type: string
          enum: [genus, color, habitat, legendary, mythical, description]
        value:
          type: string
          description: Normalized value, such as fox, blue or cave; true for legendary and mythical.
    StatName:
      type: string
      description: >
        A Pokémon base stat, a derived Pokémon stat (bulk is hp plus defense
        plus special defense, offense the higher of attack and special
        attack), or a move attribute.
      enum:
        - hp
        - attack
        - defense
        - special-attack
        - special-defense
        - speed
        - total
        - bulk
        - offense
        - power
        - accuracy
        - pp
        - priority
    StatSort:
      type: object
      required: [stat, direction]
      properties:
        stat:
          $ref: "#/components/schemas/StatName"
        direction:
          type: string
          enum: [asc, desc]
    StatFilter:
      type: object
      required: [stat, comparator, value]
      properties:
        stat:
          $ref: "#/components/schemas/StatName"
        comparator:
          type: string
          enum: [gt, gte, lt, lte]
        value:
          type: integer
    EffectConstraint:
      type: object
      required: [effect, mode, target]
      properties:
        effect:
          type: string
          description: Effect concept, such as sleep or paralysis.
        mode:
          type: string
          enum: [causes, prevents]
        target:
          type: [string, "null"]
          enum: [opponent, user, null]
    WeatherConstraint:
      type: object
      required: [weather, stat]
      properties:
        weather:
          type: string
          description: Weather concept, such as rain or sun.
        stat:
          description: Stat the weather effect must raise, as in faster in the rain.
          oneOf:
            - $ref: "#/components/schemas/StatName"
            - type: "null"
    RelationConstraint:
      type: object
      required: [predicate, entity]
      properties:
        predicate:
          type: string
          enum: [learns-move, has-ability, learned-by, carried-by]
          description: >
            learns-move and has-ability return Pokémon; learned-by returns the
            moves of a Pokémon; carried-by returns the abilities of a Pokémon.
        entity:
          $ref: "#/components/schemas/EntityRef"
    Term:
      type: object
      required: [text, role, value]
      properties:
        text:
          type: string
          description: The term as written in the query.
        role:
          type: string
          enum:
            - name
            - dex-number
            - kind
            - type
            - characteristic
            - stat
            - direction
            - comparator
            - number
            - effect
            - mode
            - target
            - weather
            - relation
            - filler
            - ignored
        value:
          type: [string, "null"]
          description: >
            The normalized concept, such as electric, speed:desc, desc, gte or
            100; null for filler and ignored terms.
    Notice:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable identifier, such as ignored-terms, approximate-match or missing-mechanic.
        message:
          type: string
    Suggestion:
      type: object
      required: [kind, label, query]
      properties:
        kind:
          type: string
          enum: [name, example]
        label:
          type: string
        query:
          type: string
    Refinement:
      type: object
      required: [constraint, action, label, query]
      properties:
        constraint:
          type: string
          description: Identifier of the constraint the refinement adjusts, such as type:electric or sort.
        action:
          type: string
          enum: [add, remove, replace]
        label:
          type: string
        query:
          type: string
          description: Canonical query that applies the refinement.
    Section:
      type: object
      required: [kind, total, results, next_cursor]
      properties:
        kind:
          $ref: "#/components/schemas/EntityKind"
        total:
          type: integer
          minimum: 1
          description: Number of results of this kind across all pages.
        results:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Result"
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page of this section; null on the last page.
    Result:
      oneOf:
        - $ref: "#/components/schemas/PokemonResult"
        - $ref: "#/components/schemas/MoveResult"
        - $ref: "#/components/schemas/AbilityResult"
      discriminator:
        propertyName: kind
        mapping:
          pokemon: "#/components/schemas/PokemonResult"
          move: "#/components/schemas/MoveResult"
          ability: "#/components/schemas/AbilityResult"
    ResultBase:
      type: object
      required: [kind, name, rank, reasons]
      properties:
        kind:
          $ref: "#/components/schemas/EntityKind"
        name:
          type: string
          description: Kebab-case dataset name.
        rank:
          type: integer
          minimum: 1
          description: Position within the section, continuing across pages.
        reasons:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Reason"
    Reason:
      type: object
      required: [type, detail, related, probability, mode, target, weather_role]
      properties:
        type:
          type: string
          enum:
            - name-exact
            - name-prefix
            - name-infix
            - name-fuzzy
            - dex-number
            - type-filter
            - characteristic
            - stat-rank
            - stat-filter
            - effect
            - weather
            - learns-move
            - has-ability
            - learned-by
            - carried-by
            - description-match
        detail:
          type: string
          description: Human-readable explanation shown to the user.
        related:
          oneOf:
            - $ref: "#/components/schemas/EntityRef"
            - type: "null"
        probability:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Probability that the effect happens, for effect reasons.
        mode:
          type: [string, "null"]
          enum: [causes, prevents, requires, null]
        target:
          type: [string, "null"]
          enum: [opponent, user, null]
        weather_role:
          type: [string, "null"]
          enum: [setter, benefit, protection, mixed, drawback, null]
    Stats:
      type: object
      required: [hp, attack, defense, special-attack, special-defense, speed]
      properties:
        hp: {type: integer}
        attack: {type: integer}
        defense: {type: integer}
        special-attack: {type: integer}
        special-defense: {type: integer}
        speed: {type: integer}
    PokemonResult:
      allOf:
        - $ref: "#/components/schemas/ResultBase"
        - type: object
          required: [kind, id, types, stats, abilities, genus, description, sprite_url, artwork_url]
          properties:
            kind:
              const: pokemon
            id:
              type: integer
            types:
              type: array
              minItems: 1
              maxItems: 2
              items:
                type: string
            stats:
              $ref: "#/components/schemas/Stats"
            abilities:
              type: array
              items:
                type: string
            genus:
              type: [string, "null"]
            description:
              type: [string, "null"]
            sprite_url:
              type: [string, "null"]
              format: uri
            artwork_url:
              type: [string, "null"]
              format: uri
    MoveResult:
      allOf:
        - $ref: "#/components/schemas/ResultBase"
        - type: object
          required: [kind, id, type, damage_class, power, accuracy, pp, priority, effect_chance, short_effect]
          properties:
            kind:
              const: move
            id:
              type: integer
            type:
              type: string
            damage_class:
              type: string
              enum: [physical, special, status]
            power:
              type: [integer, "null"]
            accuracy:
              type: [integer, "null"]
            pp:
              type: [integer, "null"]
            priority:
              type: integer
            effect_chance:
              type: [integer, "null"]
            short_effect:
              type: [string, "null"]
    AbilityResult:
      allOf:
        - $ref: "#/components/schemas/ResultBase"
        - type: object
          required: [kind, id, short_effect, generation]
          properties:
            kind:
              const: ability
            id:
              type: integer
            short_effect:
              type: [string, "null"]
            generation:
              type: string
    SuggestResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/SuggestItem"
    SuggestItem:
      type: object
      required: [kind, label, query, entity, concept]
      properties:
        kind:
          type: string
          enum: [entity, concept]
        label:
          type: string
        query:
          type: string
          description: Query to run when the suggestion is selected.
        entity:
          oneOf:
            - $ref: "#/components/schemas/EntityRef"
            - type: "null"
        concept:
          oneOf:
            - type: object
              required: [role, value]
              properties:
                role:
                  type: string
                  enum: [kind, type, characteristic, stat, direction, comparator, effect, mode, target, weather, relation]
                value:
                  type: string
            - type: "null"
    EntityDetail:
      oneOf:
        - $ref: "#/components/schemas/PokemonDetail"
        - $ref: "#/components/schemas/MoveDetail"
        - $ref: "#/components/schemas/AbilityDetail"
      discriminator:
        propertyName: kind
        mapping:
          pokemon: "#/components/schemas/PokemonDetail"
          move: "#/components/schemas/MoveDetail"
          ability: "#/components/schemas/AbilityDetail"
    PokemonDetail:
      type: object
      required:
        - kind
        - id
        - name
        - types
        - stats
        - abilities
        - moves
        - genus
        - description
        - height_decimetres
        - weight_hectograms
        - color
        - shape
        - habitat
        - is_legendary
        - is_mythical
        - evolution_family
        - sprite_url
        - artwork_url
      properties:
        kind:
          const: pokemon
        id:
          type: integer
        name:
          type: string
        types:
          type: array
          items:
            type: string
        stats:
          $ref: "#/components/schemas/Stats"
        abilities:
          type: array
          items:
            type: string
        moves:
          type: array
          items:
            type: string
        genus:
          type: [string, "null"]
        description:
          type: [string, "null"]
        height_decimetres:
          type: integer
        weight_hectograms:
          type: integer
        color:
          type: string
        shape:
          type: [string, "null"]
        habitat:
          type: [string, "null"]
        is_legendary:
          type: boolean
        is_mythical:
          type: boolean
        evolution_family:
          type: array
          description: Names of the Pokémon sharing its evolution chain, in Pokédex order.
          items:
            type: string
        sprite_url:
          type: [string, "null"]
          format: uri
        artwork_url:
          type: [string, "null"]
          format: uri
    MoveDetail:
      type: object
      required:
        - kind
        - id
        - name
        - type
        - damage_class
        - power
        - accuracy
        - pp
        - priority
        - effect_chance
        - short_effect
        - effect
        - learned_by
      properties:
        kind:
          const: move
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        damage_class:
          type: string
          enum: [physical, special, status]
        power:
          type: [integer, "null"]
        accuracy:
          type: [integer, "null"]
        pp:
          type: [integer, "null"]
        priority:
          type: integer
        effect_chance:
          type: [integer, "null"]
        short_effect:
          type: [string, "null"]
        effect:
          type: [string, "null"]
        learned_by:
          type: array
          items:
            type: string
    AbilityDetail:
      type: object
      required: [kind, id, name, short_effect, effect, generation, pokemon]
      properties:
        kind:
          const: ability
        id:
          type: integer
        name:
          type: string
        short_effect:
          type: [string, "null"]
        effect:
          type: [string, "null"]
        generation:
          type: string
        pokemon:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_query, invalid_parameter, not_found, internal_error]
            message:
              type: string
