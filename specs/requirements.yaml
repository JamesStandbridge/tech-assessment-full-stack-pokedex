# Requirements written with EARS templates:
#   ubiquitous    The <system> shall <response>.
#   event-driven  When <trigger>, the <system> shall <response>.
#   state-driven  While <state>, the <system> shall <response>.
#   unwanted      If <condition>, then the <system> shall <response>.
#   optional      Where <feature>, the <system> shall <response>.
#
# Priorities follow MoSCoW:
#   must    The brief's minimum and the quality of results. Never traded away.
#   should  How users understand and steer the search. Built once every must holds.
#   could   Visual extras. Built only if time remains, never at the expense of a must.
#
# Every requirement verified by "acceptance" must be referenced by at least one
# scenario tag in specs/features. A scenario whose most critical verified
# requirement is should or could carries the @should or @could tag.

schema_version: 1

needs:
  - id: name-recovery
    title: Recover something partially remembered
    brief_situation: 1
  - id: criteria-comparison
    title: Find and compare candidates from practical criteria
    brief_situation: 2
  - id: intent-discovery
    title: Discover an answer without knowing its vocabulary
    brief_situation: 3
  - id: strategy-exploration
    title: Explore a strategy spanning connected information
    brief_situation: 4
  - id: input-handling
    title: Handle invalid, unsupported and ambiguous queries
    brief_situation: null

requirements:
  - id: SYS-UI-001
    need: null
    template: state-driven
    statement: While a search request is in progress, the web interface shall show a loading state.
    source: brief/R1
    priority: must
    verification: ui-test

  - id: SYS-UI-002
    need: null
    template: event-driven
    statement: When a search outcome is empty or invalid, or the request fails, the web interface shall show a distinct message for that case.
    source: brief/R1
    priority: must
    verification: ui-test

  - id: SYS-API-001
    need: null
    template: ubiquitous
    statement: The search API shall return results from the published pokedex.json snapshot only.
    source: brief/R2, brief/R4
    priority: must
    verification: acceptance

  - id: SYS-API-002
    need: null
    template: unwanted
    statement: If an unexpected failure occurs, then the search API shall return a generic error without stack traces, file paths or secrets.
    source: brief/R2
    priority: must
    verification: api-test

  - id: SYS-DATA-001
    need: null
    template: event-driven
    statement: When the dataset is prepared, the preparation script shall verify the published SHA-256 checksum and fail on mismatch.
    source: brief/R4
    priority: must
    verification: unit-test

  - id: SRCH-INPUT-001
    need: input-handling
    template: unwanted
    statement: If a query has fewer than 2 characters after trimming, then the search API shall reject it as invalid.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-INPUT-002
    need: input-handling
    template: unwanted
    statement: If a query has more than 200 characters after trimming, then the search API shall reject it as invalid.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-INPUT-003
    need: input-handling
    template: ubiquitous
    statement: The search service shall ignore letter case and surrounding whitespace in queries.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-EMPTY-001
    need: input-handling
    template: unwanted
    statement: If no entity in the dataset answers a valid query, then the search API shall return an empty outcome with an explanation.
    source: brief/R3
    priority: must
    verification: acceptance

  - id: SRCH-EMPTY-002
    need: input-handling
    template: ubiquitous
    statement: The search service shall not return an entity whose only connection to the query is loose string similarity.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-AMBIG-001
    need: input-handling
    template: event-driven
    statement: When a query matches several kinds of entity, the search service shall return results for every matching reading.
    source: brief/R3
    priority: must
    verification: acceptance

  - id: SRCH-EXPL-001
    need: null
    template: ubiquitous
    statement: The search API shall attach to every result the reason it matched, naming the related entity when the match comes from a relationship.
    source: brief/product-expectations
    priority: must
    verification: api-test

  - id: SRCH-NAME-001
    need: name-recovery
    template: ubiquitous
    statement: The search service shall match queries against the names of Pokémon, moves and abilities.
    source: brief/situation-1
    priority: must
    verification: acceptance

  - id: SRCH-NAME-002
    need: name-recovery
    template: event-driven
    statement: When a query exactly matches an entity name, the search service shall rank that entity before entities whose names only start with the query.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-NAME-003
    need: name-recovery
    template: event-driven
    statement: When a query matches the start of some names and the inside of others, the search service shall rank the names that start with it first.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-NAME-004
    need: name-recovery
    template: ubiquitous
    statement: The search service shall ignore spaces, dots, apostrophes and hyphens when comparing a query with entity names.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-NAME-005
    need: name-recovery
    template: event-driven
    statement: When no entity name contains the query, the search service shall return names within a bounded edit distance of the query.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-NAME-006
    need: name-recovery
    template: optional
    statement: Where a query is a Pokédex number, the search service shall return the Pokémon with that number first.
    source: product
    priority: should
    verification: acceptance

  - id: SRCH-CRIT-001
    need: criteria-comparison
    template: event-driven
    statement: When a query names one or more types, the search service shall return only Pokémon that have all of those types.
    source: brief/situation-2
    priority: must
    verification: acceptance

  - id: SRCH-CRIT-002
    need: criteria-comparison
    template: event-driven
    statement: When a query contains a speed adjective, the search service shall rank Pokémon by base speed, descending for fast, quick and fastest, and ascending for slow and slowest.
    source: brief/situation-2
    priority: must
    verification: acceptance

  - id: SRCH-CRIT-003
    need: criteria-comparison
    template: ubiquitous
    statement: The search service shall not match criteria words such as fast, slow, quick, type or pokemon against entity names or descriptions.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-CRIT-004
    need: criteria-comparison
    template: ubiquitous
    statement: The search API shall return the types and all base stats of every Pokémon result.
    source: brief/situation-2
    priority: must
    verification: api-test

  - id: SRCH-CRIT-005
    need: criteria-comparison
    template: unwanted
    statement: If a query's criteria match no Pokémon, then the search API shall return an empty outcome that names the unmatched criteria.
    source: brief/R3
    priority: must
    verification: acceptance

  - id: SRCH-INTENT-001
    need: intent-discovery
    template: event-driven
    statement: When a query describes an effect on a target, the search service shall return moves and abilities whose short effect causes it.
    source: brief/situation-3
    priority: must
    verification: acceptance

  - id: SRCH-INTENT-002
    need: intent-discovery
    template: ubiquitous
    statement: The search service shall not return a move or ability for an effect query when the effect appears only in its long effect as a reference to another mechanic.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-INTENT-003
    need: intent-discovery
    template: ubiquitous
    statement: The search service shall not return, for a query about affecting a target, entities that only affect the user, require the effect, or prevent it.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-INTENT-004
    need: intent-discovery
    template: ubiquitous
    statement: The search service shall treat inflected forms of an effect word, such as asleep, sleeping and sleeps, as the same effect.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-INTENT-005
    need: intent-discovery
    template: event-driven
    statement: When moves or abilities match an effect query, the search service shall also return the Pokémon that learn or carry them.
    source: brief/situation-3
    priority: must
    verification: acceptance

  - id: SRCH-INTENT-006
    need: intent-discovery
    template: ubiquitous
    statement: The search service shall rank guaranteed effects before chance-based effects, and more accurate moves before less accurate ones.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-INTENT-007
    need: intent-discovery
    template: optional
    statement: Where a query asks to prevent an effect, the search service shall return entities that prevent it and exclude entities that cause it.
    source: product
    priority: should
    verification: acceptance

  - id: SRCH-STRAT-001
    need: strategy-exploration
    template: event-driven
    statement: When a query names a weather condition, the search service shall return the abilities and moves whose short or long effect depends on it, and the Pokémon that carry or learn them.
    source: brief/situation-4
    priority: must
    verification: acceptance

  - id: SRCH-STRAT-002
    need: strategy-exploration
    template: ubiquitous
    statement: The search service shall match weather words as whole words, so that rain does not match drain, brain, rainbow or trainers.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-STRAT-003
    need: strategy-exploration
    template: ubiquitous
    statement: The search service shall map weather synonyms to the dataset vocabulary, including sun to strong sunlight and Sunny Day.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-STRAT-004
    need: strategy-exploration
    template: ubiquitous
    statement: The search service shall label every weather result as a benefit or a drawback, and shall not return entities tied only to a different weather.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-STRAT-005
    need: strategy-exploration
    template: ubiquitous
    statement: The search service shall not present facts absent from the dataset, such as a rain-setting move or a rain boost to Water moves.
    source: brief/product-expectations
    priority: must
    verification: acceptance

  - id: SRCH-STRAT-006
    need: strategy-exploration
    template: optional
    statement: Where a query combines a speed adjective and a weather condition, the search service shall rank by the weather relation instead of by base speed.
    source: product
    priority: should
    verification: acceptance

  - id: SRCH-REL-001
    need: null
    template: ubiquitous
    statement: The search service shall meet the relevance thresholds in specs/relevance/thresholds.yaml for every judged query.
    source: brief/R5
    priority: must
    verification: relevance-evaluation
