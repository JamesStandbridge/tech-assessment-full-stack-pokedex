# Requirements written with EARS templates:
#   ubiquitous    The <system> shall <response>.
#   event-driven  When <trigger>, the <system> shall <response>.
#   state-driven  While <state>, the <system> shall <response>.
#   unwanted      If <condition>, then the <system> shall <response>.
#   optional      Where <feature>, the <system> shall <response>.
#
# Priorities follow MoSCoW:
#   must    The brief's minimum and the quality of results. Never traded away.
#   should  How users understand and steer the search. Built once every must holds.
#   could   Visual extras. Built only if time remains, never at the expense of a must.
# Deliberate omissions are listed under out_of_scope.
#
# Every requirement verified by "acceptance" must be referenced by at least one
# scenario tag in specs/features, and every requirement verified by "ui-test" by
# at least one scenario tag in specs/ui. A scenario whose most critical verified
# requirement is should or could carries the @should or @could tag.

schema_version: 1

needs:
  - id: name-recovery
    title: Recover something partially remembered
    brief_situation: 1
  - id: criteria-comparison
    title: Find and compare candidates from practical criteria
    brief_situation: 2
  - id: intent-discovery
    title: Discover an answer without knowing its vocabulary
    brief_situation: 3
  - id: strategy-exploration
    title: Explore a strategy spanning connected information
    brief_situation: 4
  - id: input-handling
    title: Handle invalid, unsupported and ambiguous queries
    brief_situation: null
  - id: query-understanding
    title: Know what can be searched and see how a query was understood
    brief_situation: null
  - id: visual-exploration
    title: Explore results through views suited to each kind of question
    brief_situation: null

requirements:
  # Brief: delivery (R4 to R7)

  - id: SYS-DATA-001
    need: null
    template: event-driven
    statement: When the dataset is prepared, the preparation script shall verify the published SHA-256 checksum and fail on mismatch.
    source: brief/R4
    priority: must
    verification: unit-test

  - id: SYS-TEST-001
    need: null
    template: ubiquitous
    statement: The automated tests shall cover a successful retrieval, invalid or empty input, a no-result or fallback case, and at least one relevance behaviour claimed by the product.
    source: brief/R5
    priority: must
    verification: inspection

  - id: SYS-RUN-001
    need: null
    template: ubiquitous
    statement: The repository shall document the commands that prepare the data, run the application and run the tests locally, include an .env.example when environment variables are required, and contain no secrets or dependency directories.
    source: brief/R6
    priority: must
    verification: inspection

  - id: SYS-DOC-001
    need: null
    template: ubiquitous
    statement: The README shall describe setup, architecture and data flow, the supported needs, decisions and trade-offs, limitations and next steps, time spent, five representative queries with their results, how relevance was validated, and the use of AI tools.
    source: brief/R7
    priority: must
    verification: inspection

  # Brief: frontend and backend (R1, R2)

  - id: SYS-UI-001
    need: null
    template: state-driven
    statement: While a search request is in progress, the web interface shall show a loading state.
    source: brief/R1
    priority: must
    verification: ui-test

  - id: SYS-UI-002
    need: null
    template: event-driven
    statement: When a search outcome is empty or invalid, or the request fails, the web interface shall show a distinct message for that case.
    source: brief/R1
    priority: must
    verification: ui-test

  - id: SYS-UI-003
    need: null
    template: unwanted
    statement: If an entity image cannot be loaded, then the web interface shall show a placeholder and remain fully usable.
    source: candidate-resources/README
    priority: must
    verification: ui-test

  - id: SYS-API-001
    need: null
    template: ubiquitous
    statement: The search API shall return results from the published pokedex.json snapshot only.
    source: brief/R2, brief/R4
    priority: must
    verification: acceptance

  - id: SYS-API-002
    need: null
    template: unwanted
    statement: If an unexpected failure occurs, then the search API shall return a generic error without stack traces, file paths or secrets.
    source: brief/R2
    priority: must
    verification: api-test

  # Result quality: input handling

  - id: SRCH-INPUT-001
    need: input-handling
    template: unwanted
    statement: If a query has fewer than 2 characters after trimming, then the search API shall reject it as invalid.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-INPUT-002
    need: input-handling
    template: unwanted
    statement: If a query has more than 200 characters after trimming, then the search API shall reject it as invalid.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-INPUT-003
    need: input-handling
    template: ubiquitous
    statement: The search service shall ignore letter case and surrounding whitespace in queries.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-INPUT-004
    need: input-handling
    template: ubiquitous
    statement: The search service shall ignore accents, punctuation other than a leading number sign, and the plural and hyphenated forms of vocabulary words, so that a question such as Which Pokémon can put the opponent to sleep? and a query such as electric-type pokemon are understood.
    source: brief/context
    priority: must
    verification: acceptance

  - id: SRCH-EMPTY-001
    need: input-handling
    template: unwanted
    statement: If no entity in the dataset answers a valid query, then the search API shall return an empty outcome with an explanation.
    source: brief/R3
    priority: must
    verification: acceptance

  - id: SRCH-EMPTY-002
    need: input-handling
    template: ubiquitous
    statement: The search service shall not return an entity whose only connection to the query is loose string similarity.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-AMBIG-001
    need: input-handling
    template: event-driven
    statement: When a query matches several kinds of entity, the search service shall return results for every matching reading.
    source: brief/R3
    priority: must
    verification: acceptance

  - id: SRCH-EXPL-001
    need: null
    template: ubiquitous
    statement: The search API shall attach to every result the reason it matched, naming the related entity when the match comes from a relationship.
    source: brief/product-expectations
    priority: must
    verification: api-test

  - id: SRCH-EXPL-002
    need: null
    template: ubiquitous
    statement: The search API shall express in every reason, as structured fields, the probability of an effect, whether it causes, prevents or requires it, whom it affects, and whether a weather relation is a benefit or a drawback.
    source: brief/product-expectations
    priority: must
    verification: api-test

  # Result quality: combined constraints

  - id: SRCH-KIND-001
    need: input-handling
    template: event-driven
    statement: When a query names an entity kind, such as pokemon, move or ability, in singular or plural form, the search service shall return results of that kind only.
    source: brief/context
    priority: must
    verification: acceptance

  - id: SRCH-PLAN-001
    need: input-handling
    template: event-driven
    statement: When a query combines constraints, such as types, characteristics, stat comparisons, an effect, a weather or a relation, the search service shall return only entities that satisfy all of them, and no entity of a kind to which one of them cannot apply.
    source: brief/situation-2, brief/situation-3
    priority: must
    verification: acceptance

  - id: SRCH-PLAN-002
    need: input-handling
    template: event-driven
    statement: When a query combines constraints, the search service shall rank by the stats the query asks for, and otherwise by the strength of its effect or weather relation, breaking remaining ties by dataset identifier.
    source: product
    priority: must
    verification: acceptance

  # Result quality: name recovery

  - id: SRCH-NAME-001
    need: name-recovery
    template: ubiquitous
    statement: The search service shall match queries against the names of Pokémon, moves and abilities.
    source: brief/situation-1
    priority: must
    verification: acceptance

  - id: SRCH-NAME-002
    need: name-recovery
    template: event-driven
    statement: When a query exactly matches an entity name, the search service shall rank that entity before entities whose names only start with the query.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-NAME-003
    need: name-recovery
    template: event-driven
    statement: When a query matches the start of some names and the inside of others, the search service shall rank the names that start with it first.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-NAME-004
    need: name-recovery
    template: ubiquitous
    statement: The search service shall ignore spaces, dots, apostrophes and hyphens when comparing a query with entity names.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-NAME-005
    need: name-recovery
    template: event-driven
    statement: When no entity name contains the query, the search service shall return names within a Damerau-Levenshtein distance of 1 for queries of up to 5 characters and 2 for longer queries.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-NAME-006
    need: name-recovery
    template: optional
    statement: Where a query is a Pokédex number, the search service shall return the Pokémon with that number first.
    source: product
    priority: should
    verification: acceptance

  - id: SRCH-CHAR-001
    need: name-recovery
    template: event-driven
    statement: When a query names a characteristic of a species, such as a word of its genus, its color, its habitat, or legendary or mythical, the search service shall return only Pokémon with that characteristic, reading a word that is also a type name as the type.
    source: brief/context
    priority: must
    verification: acceptance

  - id: SRCH-CHAR-002
    need: name-recovery
    template: optional
    statement: Where no other reading applies to the remaining words of a query, the search service shall match them as whole words against species descriptions, rank Pokémon by BM25, and mark the results as approximate.
    source: brief/context
    priority: could
    verification: acceptance

  # Result quality: criteria comparison

  - id: SRCH-CRIT-001
    need: criteria-comparison
    template: event-driven
    statement: When a query names one or more types, the search service shall return only Pokémon that have all of those types and, when a single type is named, moves of that type.
    source: brief/situation-2
    priority: must
    verification: acceptance

  - id: SRCH-CRIT-002
    need: criteria-comparison
    template: event-driven
    statement: When a query asks for a stat, the search service shall rank Pokémon by that stat, where the stat is hp, attack, defense, special attack, special defense, speed, base stat total, bulk (hp plus defense plus special defense) or offense (the higher of attack and special attack), descending by default and for words such as high, highest, most, best, fast, strong and bulky, and ascending for words such as low, lowest, least and slow.
    source: brief/situation-2
    priority: must
    verification: acceptance

  - id: SRCH-CRIT-003
    need: criteria-comparison
    template: ubiquitous
    statement: The search service shall not match criteria words such as fast, strong, attack, defense, high, low, quick, type or pokemon against entity names or descriptions.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-CRIT-004
    need: criteria-comparison
    template: ubiquitous
    statement: The search API shall return the types and all base stats of every Pokémon result.
    source: brief/situation-2
    priority: must
    verification: api-test

  - id: SRCH-CRIT-005
    need: criteria-comparison
    template: unwanted
    statement: If a query's criteria match no Pokémon, then the search API shall return an empty outcome that names the unmatched criteria.
    source: brief/R3
    priority: must
    verification: acceptance

  - id: SRCH-CRIT-006
    need: criteria-comparison
    template: ubiquitous
    statement: The search service shall recognize stat names in their common spellings and abbreviations, including hp, atk, special attack, sp atk, spatk, special defense, sp def, stats and base stat total, and superlatives such as fastest, strongest and bulkiest.
    source: brief/situation-2
    priority: must
    verification: acceptance

  - id: SRCH-CRIT-007
    need: criteria-comparison
    template: event-driven
    statement: When a query asks for several stats, the search service shall rank Pokémon by the mean of their percentile ranks among all Pokémon for those stats, each in its requested direction.
    source: brief/situation-2
    priority: should
    verification: acceptance

  - id: SRCH-CRIT-008
    need: criteria-comparison
    template: event-driven
    statement: When a query compares a stat with a number, the search service shall return only Pokémon that satisfy the comparison, strictly for over, above, more than, under, below and less than, and inclusively for at least and at most.
    source: brief/situation-2
    priority: should
    verification: acceptance

  - id: SRCH-MOVE-001
    need: criteria-comparison
    template: event-driven
    statement: When a query asks for moves by power, accuracy, PP, priority or damage class, the search service shall filter and rank moves by those attributes, reading strong and powerful as power.
    source: brief/context
    priority: should
    verification: acceptance

  # Result quality: intent discovery

  - id: SRCH-INTENT-001
    need: intent-discovery
    template: event-driven
    statement: When a query describes an effect on a target, the search service shall return moves and abilities whose short effect causes it.
    source: brief/situation-3
    priority: must
    verification: acceptance

  - id: SRCH-INTENT-002
    need: intent-discovery
    template: ubiquitous
    statement: The search service shall not return a move or ability for an effect query when the effect appears only in its long effect as a reference to another mechanic.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-INTENT-003
    need: intent-discovery
    template: ubiquitous
    statement: The search service shall not return, for a query about affecting a target, entities that only affect the user, require the effect, or prevent it.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-INTENT-004
    need: intent-discovery
    template: ubiquitous
    statement: The search service shall treat inflected forms of an effect word, such as asleep, sleeping and sleeps, as the same effect.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-INTENT-005
    need: intent-discovery
    template: event-driven
    statement: When moves or abilities match an effect query, the search service shall also return the Pokémon that learn or carry them.
    source: brief/situation-3
    priority: must
    verification: acceptance

  - id: SRCH-INTENT-006
    need: intent-discovery
    template: ubiquitous
    statement: The search service shall rank moves for an effect query by the probability that they cause the effect, computed as accuracy times effect chance, where a missing value counts as certain.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-INTENT-007
    need: intent-discovery
    template: optional
    statement: Where a query asks to prevent an effect, the search service shall return entities that prevent it and exclude entities that cause it.
    source: product
    priority: should
    verification: acceptance

  - id: SRCH-INTENT-008
    need: intent-discovery
    template: event-driven
    statement: When Pokémon are returned for an effect query, the search service shall rank them by the highest probability among the moves and abilities through which they can cause the effect.
    source: product
    priority: must
    verification: relevance-evaluation

  # Result quality: strategy exploration

  - id: SRCH-STRAT-001
    need: strategy-exploration
    template: event-driven
    statement: When a query names a weather condition, the search service shall return the abilities and moves whose short or long effect depends on it, and the Pokémon that carry or learn them.
    source: brief/situation-4
    priority: must
    verification: acceptance

  - id: SRCH-STRAT-002
    need: strategy-exploration
    template: ubiquitous
    statement: The search service shall match weather words as whole words, so that rain does not match drain, brain, rainbow or trainers.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-STRAT-003
    need: strategy-exploration
    template: ubiquitous
    statement: The search service shall map weather synonyms to the dataset vocabulary, including sun to strong sunlight and Sunny Day.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-STRAT-004
    need: strategy-exploration
    template: ubiquitous
    statement: The search service shall label every weather result as a setter, a benefit, a protection against weather damage, a mixed effect or a drawback under the weather queried, disregarding what the effect does under other weathers, and shall not return entities tied only to a different weather.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-STRAT-005
    need: strategy-exploration
    template: ubiquitous
    statement: The search service shall not present facts absent from the dataset, such as a rain-setting move or a rain boost to Water moves.
    source: brief/product-expectations
    priority: must
    verification: acceptance

  - id: SRCH-STRAT-006
    need: strategy-exploration
    template: optional
    statement: Where a comparative speed word applies to a weather condition, as in faster in the rain, the search service shall rank by the weather effects that raise speed instead of by base speed.
    source: product
    priority: should
    verification: acceptance

  - id: SRCH-STRAT-007
    need: strategy-exploration
    template: event-driven
    statement: When Pokémon are returned for a weather query, the search service shall rank first those that set the weather, then by the sum over their weather effects of 1 for a benefit, 0.5 for a protection or a mixed effect and -0.5 for a drawback, halved for effects that come from a move, and shall not return Pokémon whose sum is not positive unless they set the weather.
    source: product
    priority: must
    verification: acceptance

  - id: SRCH-LINK-001
    need: strategy-exploration
    template: event-driven
    statement: When a query names an entity within a sentence together with a relation, such as pokemon that learn thunder wave, pokemon with levitate or moves learned by pikachu, the search service shall return the entities linked to it by that relation.
    source: brief/context
    priority: should
    verification: acceptance

  # Result quality: evaluation

  - id: SRCH-REL-001
    need: null
    template: ubiquitous
    statement: The search service shall meet the relevance thresholds in specs/relevance/thresholds.yaml for every judged query.
    source: brief/R5
    priority: must
    verification: relevance-evaluation

  - id: SRCH-REL-002
    need: null
    template: ubiquitous
    statement: The relevance evaluation shall score the search service against grades given blind, by a human or a disclosed model, to candidates pooled from several rankers, meet the pre-registered assessor threshold, report the agreement between assessor and rule grades as quadratic-weighted Cohen's kappa, and list the candidates graded two or more apart for human adjudication.
    source: brief/R5, brief/what-we-assess
    priority: must
    verification: relevance-evaluation

  # Query understanding and interaction

  - id: SRCH-TERM-001
    need: query-understanding
    template: ubiquitous
    statement: The search API shall return every term of the query with the role it was recognized in, or mark it as ignored, and shall add a notice when a term is ignored.
    source: brief/product-expectations
    priority: must
    verification: acceptance

  - id: SRCH-PAGE-001
    need: query-understanding
    template: ubiquitous
    statement: The search API shall group results into one section per entity kind, each holding at most the requested limit of results, 20 by default and 100 at most, with the total count and a cursor to the next page.
    source: product
    priority: must
    verification: api-test

  - id: SRCH-PAGE-002
    need: query-understanding
    template: ubiquitous
    statement: The search service shall break every ranking tie by dataset identifier, so that pages are stable across requests.
    source: product
    priority: must
    verification: api-test

  - id: SRCH-CANON-001
    need: query-understanding
    template: ubiquitous
    statement: The search API shall return the canonical form of the query, which the search service shall interpret exactly as the original query.
    source: product
    priority: should
    verification: unit-test

  - id: SRCH-REFINE-001
    need: query-understanding
    template: ubiquitous
    statement: The search API shall return, for each recognized constraint, the refinements available to the user, each with a label and the canonical query that applies it.
    source: product
    priority: should
    verification: api-test

  - id: SRCH-BEST-001
    need: query-understanding
    template: event-driven
    statement: When a query exactly matches one entity name, or is the prefix of exactly one name, the search API shall identify that entity as the best match.
    source: brief/situation-1
    priority: should
    verification: acceptance

  - id: SRCH-SUGGEST-001
    need: query-understanding
    template: event-driven
    statement: When the outcome is empty, the search API shall suggest names close to the query beyond the typo bound, if any, and example queries for each supported need.
    source: brief/product-expectations
    priority: should
    verification: api-test

  - id: SRCH-SUGGEST-002
    need: query-understanding
    template: optional
    statement: Where the query is being typed, the suggestion API shall return matching entity names and vocabulary concepts within 100 milliseconds.
    source: product
    priority: could
    verification: api-test

  - id: SRCH-ENTITY-001
    need: strategy-exploration
    template: ubiquitous
    statement: The entity API shall return any Pokémon, move or ability by kind and name, with its related entities.
    source: brief/situation-4
    priority: should
    verification: api-test

  - id: SYS-UI-004
    need: query-understanding
    template: state-driven
    statement: While no query has been submitted, the web interface shall present the four supported kinds of question, each with an example query that runs when selected.
    source: brief/product-expectations
    priority: must
    verification: ui-test

  - id: SYS-UI-005
    need: query-understanding
    template: event-driven
    statement: When the user pauses typing, the web interface shall show how each term is understood, displaying ignored terms distinctly.
    source: product
    priority: should
    verification: ui-test

  - id: SYS-UI-006
    need: query-understanding
    template: event-driven
    statement: When the user applies a refinement, the web interface shall replace the query text with the refinement's canonical query and run it.
    source: product
    priority: should
    verification: ui-test

  - id: SYS-UI-007
    need: query-understanding
    template: ubiquitous
    statement: The web interface shall keep the query in the page URL, so that reloading, sharing and navigating back restore the search.
    source: product
    priority: should
    verification: ui-test

  - id: SYS-UI-008
    need: visual-exploration
    template: ubiquitous
    statement: The web interface shall adapt the results view to the reading of the query, highlighting the best match for a name, comparing the ranking stat for criteria, showing probability and relation chains for an effect, and showing benefits and drawbacks for a weather.
    source: product
    priority: should
    verification: ui-test

  - id: SYS-UI-015
    need: query-understanding
    template: event-driven
    statement: When the user has typed at least two characters, the web interface shall offer entity names and vocabulary concepts that can be chosen with the keyboard, and run the query of the chosen suggestion.
    source: product
    priority: should
    verification: ui-test

  - id: SYS-UI-016
    need: name-recovery
    template: event-driven
    statement: When the user opens a result, the web interface shall show the entity in full with its related entities, each of which can be opened in turn.
    source: brief/situation-1
    priority: should
    verification: ui-test

  - id: SYS-UI-017
    need: criteria-comparison
    template: event-driven
    statement: When a section has more results than it shows and the user asks for more, the web interface shall append the next page of that section and keep the results already shown.
    source: product
    priority: should
    verification: ui-test

  - id: SYS-UI-018
    need: input-handling
    template: event-driven
    statement: When a query has several readings, the web interface shall name every reading it shows results for.
    source: product
    priority: should
    verification: ui-test

  - id: SYS-UI-019
    need: query-understanding
    template: event-driven
    statement: When a response carries notices, the web interface shall show every notice beside the results.
    source: product
    priority: should
    verification: ui-test

  - id: SYS-UI-020
    need: intent-discovery
    template: ubiquitous
    statement: The web interface shall show with every result the reasons it matched, naming the related entity when the match comes from a relationship.
    source: brief/situation-3
    priority: must
    verification: ui-test

  - id: SYS-UI-021
    need: null
    template: ubiquitous
    statement: The web interface shall remain fully usable, without horizontal scrolling, from a viewport width of 360 pixels.
    source: product
    priority: should
    verification: ui-test

  - id: SYS-UI-022
    need: query-understanding
    template: state-driven
    statement: While the user types, the web interface shall send at most one search per pause and discard responses to queries it no longer shows.
    source: product
    priority: should
    verification: ui-test

  - id: SYS-UI-023
    need: input-handling
    template: event-driven
    statement: When an outcome is empty, the web interface shall show its explanation and suggestions, each of which runs its query when selected.
    source: product
    priority: should
    verification: ui-test

  # Visual extras

  - id: SYS-UI-009
    need: visual-exploration
    template: optional
    statement: Where the best match is a Pokémon, the web interface shall present it as a collectible card showing its artwork, genus and description.
    source: product
    priority: could
    verification: ui-test

  - id: SYS-UI-010
    need: visual-exploration
    template: optional
    statement: Where the query reads as a weather strategy, the web interface shall show a matching background ambience.
    source: product
    priority: could
    verification: ui-test

  - id: SYS-UI-011
    need: visual-exploration
    template: optional
    statement: Where results are ranked by a stat, the web interface shall animate the comparison and let the user overlay the stat profiles of selected Pokémon.
    source: product
    priority: could
    verification: ui-test

  - id: SYS-UI-012
    need: visual-exploration
    template: optional
    statement: Where the query reads as a weather strategy, the web interface shall show the weather, abilities, moves and Pokémon as a navigable graph of their relations.
    source: product
    priority: could
    verification: ui-test

  - id: SYS-UI-013
    need: visual-exploration
    template: optional
    statement: Where the team tray is used, the web interface shall hold up to six Pokémon and show the weather effects they share.
    source: brief/situation-2
    priority: could
    verification: ui-test

  - id: SYS-UI-014
    need: visual-exploration
    template: optional
    statement: Where the browser supports speech, the web interface shall accept spoken queries and read a Pokédex entry aloud on request.
    source: product
    priority: could
    verification: ui-test

  # Guardrails for every visual feature that ships

  - id: SYS-A11Y-001
    need: visual-exploration
    template: optional
    statement: Where results are shown as a graph, chart or animation, the web interface shall offer the same results as an accessible list.
    source: product
    priority: must
    verification: ui-test

  - id: SYS-A11Y-002
    need: null
    template: ubiquitous
    statement: The web interface shall be fully operable with the keyboard.
    source: brief/product-expectations
    priority: should
    verification: ui-test

  - id: SYS-A11Y-003
    need: null
    template: state-driven
    statement: While the user prefers reduced motion, the web interface shall show no animation beyond simple fades.
    source: product
    priority: must
