# Development processes, started by just dev.
version: "0.5"

processes:
  data:
    description: Download the published snapshot and verify its checksum
    command: mise run data
    availability:
      restart: "no"

  api:
    description: Search API on http://127.0.0.1:8000
    command: mise run serve
    depends_on:
      data:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8000
        path: /api/health
      initial_delay_seconds: 1
      period_seconds: 2
      failure_threshold: 15
    availability:
      restart: on_failure
      backoff_seconds: 2
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 5

  web:
    description: Interface on http://127.0.0.1:5173
    command: mise run web
    depends_on:
      api:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 5173
        path: /
      initial_delay_seconds: 1
      period_seconds: 2
      failure_threshold: 15
    availability:
      restart: on_failure
      backoff_seconds: 2
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 5
