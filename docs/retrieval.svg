<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="title desc">
  <title id="title">One query, one model per constraint</title>
  <desc id="desc">The query water pokemon that can put the opponent to sleep is split into constraints. Name uses tiered string matching, type and stat use a filter then a sort, an effect uses extracted facts ranked by chance, and weather uses a weighted relation graph. A result must satisfy every constraint, so only Water species that can cause sleep remain.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .bg { fill: #ffffff; }
      .lane-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; }
      .name { font-size: 14px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
      .sub { font-size: 12px; fill: #57606a; text-anchor: middle; }
      .edge { font-size: 11px; fill: #6b7280; font-style: italic; }
      .flow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
      .head { fill: #8c959f; }
      .box { fill: #ffffff; stroke-width: 1.4; }
      .bar { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.4; }
      .box-i { stroke: #c9962e; }
      .box-a { stroke: #3f9a68; }
      .box-u { stroke: #5a62cf; }
      .box-w { stroke: #2f8fa3; }
      .label-i { fill: #9a6b12; }
      .label-a { fill: #2c7a50; }
      .label-u { fill: #434ab8; }
      .label-w { fill: #1d6f80; }
      .tick-i { fill: #c9962e; }
      .tick-a { fill: #3f9a68; }
      .tick-u { fill: #5a62cf; }
      .tick-w { fill: #2f8fa3; }
      .pill-a { fill: #eaf6ef; stroke: #3f9a68; stroke-width: 1.2; }
      .pill-u { fill: #eef0fb; stroke: #5a62cf; stroke-width: 1.2; }
      .pill { font-size: 11px; font-weight: 650; text-anchor: middle; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .name { fill: #e6edf3; }
        .sub { fill: #9da7b3; }
        .edge { fill: #8b949e; }
        .flow { stroke: #6e7681; }
        .head { fill: #6e7681; }
        .box { fill: #161b22; }
        .bar { fill: #161b22; stroke: #30363d; }
        .box-i { stroke: #d2a445; }
        .box-a { stroke: #4fb07c; }
        .box-u { stroke: #7a82e6; }
        .box-w { stroke: #4eb0c4; }
        .label-i { fill: #e0b458; }
        .label-a { fill: #62c490; }
        .label-u { fill: #9aa0f0; }
        .label-w { fill: #7dcedd; }
        .tick-i { fill: #d2a445; }
        .tick-a { fill: #4fb07c; }
        .tick-u { fill: #7a82e6; }
        .tick-w { fill: #4eb0c4; }
        .pill-a { fill: #0f1d16; stroke: #4fb07c; }
        .pill-u { fill: #14162a; stroke: #7a82e6; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="500" rx="12"/>

  <rect class="bar" x="20" y="20" width="960" height="88" rx="14"/>
  <text class="lane-label label-a" x="40" y="48">QUERY</text>
  <text class="name" x="500" y="72">water pokemon that can put the opponent to sleep</text>
  <text class="edge" x="500" y="92" text-anchor="middle">parsed into constraints; a result must satisfy every one</text>

  <rect class="box box-i" x="20" y="132" width="228" height="196" rx="12"/>
  <rect class="tick-i" x="118" y="146" width="32" height="3" rx="1.5"/>
  <text class="lane-label label-i" x="134" y="172" text-anchor="middle">NAME</text>
  <text class="name" x="134" y="198">String match</text>
  <text class="sub" x="134" y="224">Exact, then prefix,</text>
  <text class="sub" x="134" y="242">then infix. Typos only</text>
  <text class="sub" x="134" y="260">if nothing else matches.</text>
  <text class="edge" x="134" y="300" text-anchor="middle">not in this query</text>

  <rect class="box box-a" x="264" y="132" width="228" height="196" rx="12"/>
  <rect class="tick-a" x="362" y="146" width="32" height="3" rx="1.5"/>
  <text class="lane-label label-a" x="378" y="172" text-anchor="middle">TYPE AND STAT</text>
  <text class="name" x="378" y="198">Filter, then sort</text>
  <text class="sub" x="378" y="224">Types intersect. A word</text>
  <text class="sub" x="378" y="242">such as fast sorts by</text>
  <text class="sub" x="378" y="260">the stat, never as text.</text>
  <rect class="pill-a" x="336" y="282" width="84" height="24" rx="12"/>
  <text class="pill label-a" x="378" y="298">water</text>

  <rect class="box box-u" x="508" y="132" width="228" height="196" rx="12"/>
  <rect class="tick-u" x="606" y="146" width="32" height="3" rx="1.5"/>
  <text class="lane-label label-u" x="622" y="172" text-anchor="middle">EFFECT</text>
  <text class="name" x="622" y="198">Facts, by chance</text>
  <text class="sub" x="622" y="224">Effect, target and</text>
  <text class="sub" x="622" y="242">probability. A species</text>
  <text class="sub" x="622" y="260">inherits its best source.</text>
  <rect class="pill-u" x="540" y="282" width="164" height="24" rx="12"/>
  <text class="pill label-u" x="622" y="298">sleep on the opponent</text>

  <rect class="box box-w" x="752" y="132" width="228" height="196" rx="12"/>
  <rect class="tick-w" x="850" y="146" width="32" height="3" rx="1.5"/>
  <text class="lane-label label-w" x="866" y="172" text-anchor="middle">WEATHER</text>
  <text class="name" x="866" y="198">Weighted relations</text>
  <text class="sub" x="866" y="224">Benefit +1, protection</text>
  <text class="sub" x="866" y="242">+0.5, drawback -0.5.</text>
  <text class="sub" x="866" y="260">Setters come first.</text>
  <text class="edge" x="866" y="300" text-anchor="middle">not in this query</text>

  <path class="flow" d="M500 340 V368" marker-end="url(#arrow)"/>
  <text class="edge" x="514" y="356" text-anchor="start">all must hold</text>

  <rect class="bar" x="20" y="376" width="960" height="100" rx="14"/>
  <text class="lane-label label-a" x="40" y="404">ONE PLAN</text>
  <text class="name" x="500" y="430">poliwag, poliwhirl, poliwrath, lapras</text>
  <text class="sub" x="500" y="452">Each is Water and can cause sleep. Another reading stays its own plan.</text>
</svg>
