<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Architecture and data flow of the Pokédex search</title>
  <desc id="desc">The snapshot is checked, classified and indexed at startup. A query goes from the interface to the search API, which parses it into plans, filters and sorts in the index, ranks, and returns sections with reasons. The interface picks a view from the API's reading and drives the results panel, the constellation and the workbench.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .bg { fill: #ffffff; }
      .lane-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; }
      .lane-note { font-size: 11px; fill: #6b7280; }
      .name { font-size: 14px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
      .sub { font-size: 12px; fill: #57606a; text-anchor: middle; }
      .edge { font-size: 11px; fill: #6b7280; font-style: italic; }
      .note { font-size: 12px; fill: #57606a; }
      .flow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
      .dashed { stroke-dasharray: 5 4; }
      .head { fill: #8c959f; }
      .box { fill: #ffffff; stroke-width: 1.4; }

      .lane-i { fill: #fbf5e6; stroke: #ecdcb0; }
      .box-i { stroke: #c9962e; }
      .label-i { fill: #9a6b12; }
      .lane-a { fill: #eaf6ef; stroke: #bfe0cc; }
      .box-a { stroke: #3f9a68; }
      .label-a { fill: #2c7a50; }
      .lane-u { fill: #eef0fb; stroke: #cdd2f2; }
      .box-u { stroke: #5a62cf; }
      .label-u { fill: #434ab8; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .name { fill: #e6edf3; }
        .sub, .note { fill: #9da7b3; }
        .edge, .lane-note { fill: #8b949e; }
        .flow { stroke: #6e7681; }
        .head { fill: #6e7681; }
        .box { fill: #161b22; }
        .lane-i { fill: #1d1a10; stroke: #4a3d1a; }
        .box-i { stroke: #d2a445; }
        .label-i { fill: #e0b458; }
        .lane-a { fill: #0f1d16; stroke: #1f4a33; }
        .box-a { stroke: #4fb07c; }
        .label-a { fill: #62c490; }
        .lane-u { fill: #14162a; stroke: #2e3366; }
        .box-u { stroke: #7a82e6; }
        .label-u { fill: #9aa0f0; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="650" rx="12"/>

  <!-- Indexing -->
  <rect class="lane-i" x="20" y="20" width="960" height="150" rx="14"/>
  <text class="lane-label label-i" x="40" y="46">INDEXING</text>
  <text class="lane-note" x="112" y="46">once, when the API starts</text>

  <rect class="box box-i" x="40" y="62" width="160" height="76" rx="10"/>
  <text class="name" x="120" y="90">pokedex.json</text>
  <text class="sub" x="120" y="110">151 Pokémon, 164 moves</text>
  <text class="sub" x="120" y="126">114 abilities</text>

  <rect class="box box-i" x="230" y="62" width="160" height="76" rx="10"/>
  <text class="name" x="310" y="90">Checksum</text>
  <text class="sub" x="310" y="110">SHA-256 of the</text>
  <text class="sub" x="310" y="126">published snapshot</text>

  <rect class="box box-i" x="420" y="62" width="160" height="76" rx="10"/>
  <text class="name" x="500" y="90">EffectClassifier</text>
  <text class="sub" x="500" y="110">effect text to facts:</text>
  <text class="sub" x="500" y="126">effect, target, chance</text>

  <rect class="box box-i" x="610" y="62" width="160" height="76" rx="10"/>
  <text class="name" x="690" y="90">Index builder</text>
  <text class="sub" x="690" y="110">relations copied</text>
  <text class="sub" x="690" y="126">onto each Pokémon</text>

  <rect class="box box-i" x="800" y="62" width="160" height="76" rx="10"/>
  <text class="name" x="880" y="90">SearchIndex</text>
  <text class="sub" x="880" y="110">in-memory adapter,</text>
  <text class="sub" x="880" y="126">the part tied to scale</text>

  <path class="flow" d="M202 100 H228" marker-end="url(#arrow)"/>
  <path class="flow" d="M392 100 H418" marker-end="url(#arrow)"/>
  <path class="flow" d="M582 100 H608" marker-end="url(#arrow)"/>
  <path class="flow" d="M772 100 H798" marker-end="url(#arrow)"/>

  <!-- Search API -->
  <rect class="lane-a" x="20" y="200" width="960" height="150" rx="14"/>
  <text class="lane-label label-a" x="40" y="226">SEARCH API</text>
  <text class="lane-note" x="126" y="226">FastAPI, stateless</text>

  <rect class="box box-a" x="40" y="242" width="160" height="76" rx="10"/>
  <text class="name" x="120" y="270">GET /api/search</text>
  <text class="sub" x="120" y="290">query of 2 to 200</text>
  <text class="sub" x="120" y="306">chars, else a 400</text>

  <rect class="box box-a" x="230" y="242" width="160" height="76" rx="10"/>
  <text class="name" x="310" y="270">QueryParser</text>
  <text class="sub" x="310" y="290">text to one or more</text>
  <text class="sub" x="310" y="306">conjunctive plans</text>

  <rect class="box box-a" x="420" y="242" width="160" height="76" rx="10"/>
  <text class="name" x="500" y="270">SearchIndex</text>
  <text class="sub" x="500" y="290">filters, sorts, name</text>
  <text class="sub" x="500" y="306">tiers, relations</text>

  <rect class="box box-a" x="610" y="242" width="160" height="76" rx="10"/>
  <text class="name" x="690" y="270">Ranker</text>
  <text class="sub" x="690" y="290">one model per kind</text>
  <text class="sub" x="690" y="306">of constraint, reasons</text>

  <rect class="box box-a" x="800" y="242" width="160" height="76" rx="10"/>
  <text class="name" x="880" y="270">Response</text>
  <text class="sub" x="880" y="290">sections, notices,</text>
  <text class="sub" x="880" y="306">the query's reading</text>

  <path class="flow" d="M202 280 H228" marker-end="url(#arrow)"/>
  <path class="flow" d="M392 280 H418" marker-end="url(#arrow)"/>
  <path class="flow" d="M582 280 H608" marker-end="url(#arrow)"/>
  <path class="flow" d="M772 280 H798" marker-end="url(#arrow)"/>

  <path class="flow dashed" d="M880 140 V186 H500 V240" marker-end="url(#arrow)"/>
  <text class="edge" x="690" y="182" text-anchor="middle">loaded at startup</text>

  <!-- Interface -->
  <rect class="lane-u" x="20" y="380" width="960" height="250" rx="14"/>
  <text class="lane-label label-u" x="40" y="406">INTERFACE</text>
  <text class="lane-note" x="120" y="406">React, in the browser</text>

  <rect class="box box-u" x="40" y="422" width="160" height="76" rx="10"/>
  <text class="name" x="120" y="450">Command bar</text>
  <text class="sub" x="120" y="470">query, suggestions,</text>
  <text class="sub" x="120" y="486">how-to-ask guide</text>

  <rect class="box box-u" x="230" y="422" width="160" height="76" rx="10"/>
  <text class="name" x="310" y="450">TanStack Query</text>
  <text class="sub" x="310" y="470">cache, cancellation,</text>
  <text class="sub" x="310" y="486">loading, error states</text>

  <rect class="box box-u" x="610" y="422" width="160" height="76" rx="10"/>
  <text class="name" x="690" y="450">Reading</text>
  <text class="sub" x="690" y="470">chosen from the API's</text>
  <text class="sub" x="690" y="486">interpretation</text>

  <rect class="box box-u" x="420" y="530" width="160" height="76" rx="10"/>
  <text class="name" x="500" y="558">Constellation</text>
  <text class="sub" x="500" y="578">three.js WebGPU in a</text>
  <text class="sub" x="500" y="594">worker, SVG fallback</text>

  <rect class="box box-u" x="610" y="530" width="160" height="76" rx="10"/>
  <text class="name" x="690" y="558">Results panel</text>
  <text class="sub" x="690" y="578">one view per reading,</text>
  <text class="sub" x="690" y="594">a reason per result</text>

  <rect class="box box-u" x="800" y="530" width="160" height="76" rx="10"/>
  <text class="name" x="880" y="558">Party and bench</text>
  <text class="sub" x="880" y="578">party of six, bench</text>
  <text class="sub" x="880" y="594">of four, with undo</text>

  <text class="note" x="40" y="560">The query, the party and the bench</text>
  <text class="note" x="40" y="578">live in the URL, so every screen</text>
  <text class="note" x="40" y="596">can be shared or reloaded.</text>

  <path class="flow" d="M202 460 H228" marker-end="url(#arrow)"/>
  <path class="flow" d="M310 420 V366 H120 V320" marker-end="url(#arrow)"/>
  <text class="edge" x="215" y="361" text-anchor="middle">?q=</text>
  <path class="flow" d="M880 320 V366 H690 V420" marker-end="url(#arrow)"/>
  <text class="edge" x="785" y="361" text-anchor="middle">JSON</text>
  <path class="flow" d="M690 500 V528" marker-end="url(#arrow)"/>
  <path class="flow" d="M690 510 H500 V528" marker-end="url(#arrow)"/>
  <path class="flow" d="M772 568 H798" marker-end="url(#arrow)"/>
</svg>
