<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="title desc">
  <title id="title">How each reading rearranges the constellation</title>
  <desc id="desc">The same 151 species stay in the sky. A name brings the best match forward, a stat lines candidates up on an axis, an effect gathers carriers around the move or ability, and a weather seats them on rings of benefit and drawback.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .bg { fill: #ffffff; }
      .lane-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-anchor: middle; }
      .sub { font-size: 12px; fill: #57606a; text-anchor: middle; }
      .star { fill: #1f2328; }
      .dim { fill: #9aa1ab; }
      .ring { fill: none; stroke-width: 1.3; }
      .filament { fill: none; stroke: #8c959f; stroke-width: 1.2; }
      .orbit { fill: none; stroke: #8c959f; stroke-width: 1.1; stroke-dasharray: 3 4; }
      .lane-i { fill: #fbf5e6; stroke: #ecdcb0; }
      .lane-a { fill: #eaf6ef; stroke: #bfe0cc; }
      .lane-u { fill: #eef0fb; stroke: #cdd2f2; }
      .lane-w { fill: #e7f4f6; stroke: #b7dce3; }
      .label-i { fill: #9a6b12; }
      .label-a { fill: #2c7a50; }
      .label-u { fill: #434ab8; }
      .label-w { fill: #1d6f80; }
      .ink-i { fill: #c9962e; }
      .ink-a { fill: #3f9a68; }
      .ink-u { fill: #5a62cf; }
      .ink-w { fill: #2f8fa3; }
      .stroke-i { stroke: #c9962e; }
      .stroke-a { stroke: #3f9a68; }
      .stroke-u { stroke: #5a62cf; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .sub { fill: #9da7b3; }
        .star { fill: #e6edf3; }
        .dim { fill: #6e7681; }
        .filament, .orbit { stroke: #6e7681; }
        .lane-i { fill: #1d1a10; stroke: #4a3d1a; }
        .lane-a { fill: #0f1d16; stroke: #1f4a33; }
        .lane-u { fill: #14162a; stroke: #2e3366; }
        .lane-w { fill: #0e1c20; stroke: #1d4450; }
        .label-i { fill: #e0b458; }
        .label-a { fill: #62c490; }
        .label-u { fill: #9aa0f0; }
        .label-w { fill: #7dcedd; }
        .ink-i { fill: #d2a445; }
        .ink-a { fill: #4fb07c; }
        .ink-u { fill: #7a82e6; }
        .ink-w { fill: #4eb0c4; }
        .stroke-i { stroke: #d2a445; }
        .stroke-a { stroke: #4fb07c; }
        .stroke-u { stroke: #7a82e6; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="320" rx="12"/>

  <rect class="lane-i" x="20" y="16" width="228" height="288" rx="14" stroke-width="1.4"/>
  <text class="lane-label label-i" x="134" y="44">NAME</text>
  <g transform="translate(134 148)">
    <circle class="dim" cx="-72" cy="-36" r="2.5"/>
    <circle class="dim" cx="-46" cy="-58" r="2"/>
    <circle class="dim" cx="-12" cy="-44" r="2.5"/>
    <circle class="dim" cx="22" cy="-60" r="2"/>
    <circle class="dim" cx="54" cy="-40" r="2.5"/>
    <circle class="dim" cx="76" cy="-8" r="2"/>
    <circle class="dim" cx="-78" cy="4" r="2"/>
    <circle class="dim" cx="-36" cy="-6" r="2.5"/>
    <circle class="dim" cx="8" cy="-12" r="2"/>
    <circle class="dim" cx="48" cy="2" r="2.5"/>
    <circle class="ring stroke-i" cx="0" cy="40" r="16"/>
    <circle class="ink-i" cx="0" cy="40" r="7"/>
  </g>
  <text class="sub" x="134" y="272">The best match comes forward</text>

  <rect class="lane-a" x="264" y="16" width="228" height="288" rx="14" stroke-width="1.4"/>
  <text class="lane-label label-a" x="378" y="44">CRITERIA</text>
  <g transform="translate(378 150)">
    <line class="filament stroke-a" x1="-88" y1="34" x2="88" y2="-34"/>
    <circle class="dim" cx="-74" cy="28" r="3"/>
    <circle class="dim" cx="-44" cy="16" r="3.5"/>
    <circle class="star" cx="-14" cy="5" r="4.5"/>
    <circle class="star" cx="16" cy="-7" r="5.5"/>
    <circle class="ink-a" cx="46" cy="-18" r="7"/>
    <circle class="ink-a" cx="76" cy="-30" r="9"/>
  </g>
  <text class="sub" x="378" y="272">Candidates line up on the stat</text>

  <rect class="lane-u" x="508" y="16" width="228" height="288" rx="14" stroke-width="1.4"/>
  <text class="lane-label label-u" x="622" y="44">EFFECT</text>
  <g transform="translate(622 150)">
    <line class="filament" x1="0" y1="0" x2="0" y2="-62"/>
    <line class="filament" x1="0" y1="0" x2="59" y2="-19"/>
    <line class="filament" x1="0" y1="0" x2="36" y2="50"/>
    <line class="filament" x1="0" y1="0" x2="-36" y2="50"/>
    <line class="filament" x1="0" y1="0" x2="-59" y2="-19"/>
    <circle class="star" cx="0" cy="-62" r="4"/>
    <circle class="star" cx="59" cy="-19" r="4"/>
    <circle class="star" cx="36" cy="50" r="4"/>
    <circle class="star" cx="-36" cy="50" r="4"/>
    <circle class="star" cx="-59" cy="-19" r="4"/>
    <circle class="ring stroke-u" cx="0" cy="0" r="14"/>
    <circle class="ink-u" cx="0" cy="0" r="5"/>
  </g>
  <text class="sub" x="622" y="272">Carriers gather around the move</text>

  <rect class="lane-w" x="752" y="16" width="228" height="288" rx="14" stroke-width="1.4"/>
  <text class="lane-label label-w" x="866" y="44">WEATHER</text>
  <g transform="translate(866 148)">
    <circle class="orbit" r="26"/>
    <circle class="orbit" r="50"/>
    <circle class="orbit" r="74"/>
    <circle class="ink-w" cx="0" cy="-26" r="4"/>
    <circle class="ink-w" cx="22" cy="13" r="4"/>
    <circle class="ink-w" cx="-22" cy="13" r="4"/>
    <circle class="star" cx="50" cy="0" r="3.5"/>
    <circle class="star" cx="25" cy="-43" r="3.5"/>
    <circle class="star" cx="-25" cy="-43" r="3.5"/>
    <circle class="star" cx="-50" cy="0" r="3.5"/>
    <circle class="star" cx="-25" cy="43" r="3.5"/>
    <circle class="star" cx="25" cy="43" r="3.5"/>
    <circle class="dim" cx="0" cy="-74" r="2.5"/>
    <circle class="dim" cx="64" cy="-37" r="2.5"/>
    <circle class="dim" cx="64" cy="37" r="2.5"/>
    <circle class="dim" cx="0" cy="74" r="2.5"/>
    <circle class="dim" cx="-64" cy="37" r="2.5"/>
    <circle class="dim" cx="-64" cy="-37" r="2.5"/>
  </g>
  <text class="sub" x="866" y="272">Rings of benefit and drawback</text>
</svg>
