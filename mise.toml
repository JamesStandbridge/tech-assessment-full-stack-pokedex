# Language runtimes and tasks of the project. The justfile exposes every task
# under the same name; flox provides mise, just and process-compose.

[tools]
python = "3.14.7"
uv = "0.10.12"
node = "24.21.0"
pnpm = "12.8.1"

[env]
UV_PYTHON = "3.14"
UV_PYTHON_PREFERENCE = "only-system"
POKEDEX_API_URL = "http://127.0.0.1:8000"
PC_SOCKET_PATH = "{{config_root}}/.process-compose.sock"
PC_LOG_FILE = "{{config_root}}/.process-compose.log"

[tasks."install:backend"]
description = "Install the backend dependencies from the lock file"
dir = "backend"
run = "uv sync --locked"

[tasks."install:tooling"]
description = "Install the tooling dependencies from the lock file"
dir = "tooling"
run = "uv sync --locked"

[tasks."install:frontend"]
description = "Install the frontend dependencies from the lock file"
dir = "frontend"
run = "pnpm install --frozen-lockfile"

[tasks.install]
description = "Install every dependency"
depends = ["install:backend", "install:tooling", "install:frontend"]

[tasks.data]
description = "Download the published snapshot and verify its checksum"
dir = "tooling"
depends = ["install:tooling"]
run = "uv run prepare-data"

[tasks.setup]
description = "Prepare a fresh clone: runtimes, dependencies and dataset"
depends = ["install", "data"]
run = "echo 'Setup complete. Run just dev to start the search API and the interface.'"

[tasks.serve]
description = "Run the search API"
dir = "backend"
run = "uv run serve"

[tasks.web]
description = "Run the interface development server"
dir = "frontend"
run = "pnpm run dev"

[tasks.dev]
description = "Run the development processes with process-compose"
run = "process-compose up --use-uds"

[tasks."dev:down"]
description = "Stop the development processes of this project"
run = "process-compose down --use-uds"

[tasks."api:types"]
description = "Regenerate the frontend contract types from specs/api/openapi.yaml"
dir = "frontend"
run = "pnpm run api:types"

[tasks.fixtures]
description = "Record responses of the current API as typed frontend test fixtures"
run = "scripts/with-api.sh bash -c 'cd frontend && pnpm run fixtures'"

[tasks."lint:backend"]
description = "Lint and check the formatting of the backend"
dir = "backend"
run = ["uv run ruff check", "uv run ruff format --check"]

[tasks."lint:tooling"]
description = "Lint and check the formatting of the tooling"
dir = "tooling"
run = ["uv run ruff check", "uv run ruff format --check"]

[tasks."lint:frontend"]
description = "Lint and check the formatting of the frontend"
dir = "frontend"
run = ["pnpm run lint", "pnpm run format:check"]

[tasks.lint]
description = "Lint every project"
depends = ["lint:backend", "lint:tooling", "lint:frontend"]

[tasks."format"]
description = "Format and autofix every project"
run = [
  "cd backend && uv run ruff format && uv run ruff check --fix",
  "cd tooling && uv run ruff format && uv run ruff check --fix",
  "cd frontend && pnpm run format && pnpm run lint --fix",
]

[tasks."typecheck:backend"]
description = "Type check the backend with mypy strict"
dir = "backend"
run = "uv run mypy"

[tasks."typecheck:tooling"]
description = "Type check the tooling with mypy strict"
dir = "tooling"
run = "uv run mypy"

[tasks."typecheck:frontend"]
description = "Type check the frontend and check that its contract types are current"
dir = "frontend"
run = ["pnpm run api:types:check", "pnpm run typecheck"]

[tasks.typecheck]
description = "Type check every project"
depends = ["typecheck:backend", "typecheck:tooling", "typecheck:frontend"]

[tasks."layers:backend"]
description = "Check the backend layer contracts"
dir = "backend"
run = "uv run lint-imports"

[tasks."layers:frontend"]
description = "Check the frontend layer rules and unused code"
dir = "frontend"
run = ["pnpm run layers", "pnpm run knip"]

[tasks.layers]
description = "Check the layer rules of every project"
depends = ["layers:backend", "layers:frontend"]

[tasks."test:backend"]
description = "Run the backend tests"
dir = "backend"
run = "uv run pytest -q"

[tasks."test:tooling"]
description = "Run the tooling unit tests"
dir = "tooling"
run = "uv run pytest -q"

[tasks."test:frontend"]
description = "Run the frontend unit and component tests with coverage thresholds"
dir = "frontend"
run = "pnpm run test"

[tasks.test]
description = "Run every unit test suite"
depends = ["test:backend", "test:tooling", "test:frontend"]

[tasks."build:frontend"]
description = "Build the interface for production"
dir = "frontend"
run = "pnpm run build"

[tasks.size]
description = "Check the initial JavaScript budget of the production build"
dir = "frontend"
depends = ["build:frontend"]
run = "pnpm run size"

[tasks.ui]
description = "Run the interface scenarios of specs/ui against the production build and a fresh API"
dir = "frontend"
depends = ["build:frontend"]
env = { POKEDEX_UI_TAGS = "not @SYS-UI-013 and not @SYS-UI-014" }
run = "pnpm run ui"

[tasks.lighthouse]
description = "Check the Lighthouse budgets of the production build against a fresh API"
dir = "frontend"
depends = ["build:frontend"]
run = "../scripts/with-api.sh pnpm run lighthouse"

[tasks.audit]
description = "Fail on a high vulnerability shipped to users, or a critical one anywhere"
dir = "frontend"
run = ["pnpm audit --prod --audit-level high", "pnpm audit --audit-level critical"]

[tasks.specs]
description = "Check that the specifications are consistent"
dir = "tooling"
run = "uv run validate-specs"

[tasks.check]
description = "Run every check that needs no running API"
depends = ["lint", "typecheck", "layers", "test", "size", "specs"]

[tasks.acceptance]
description = "Run the Gherkin acceptance scenarios against the search API"
dir = "tooling"
run = "../scripts/with-api.sh uv run pytest tests/acceptance -q"

[tasks.relevance]
description = "Evaluate relevance against the judgments and the assessor grades"
dir = "tooling"
run = "../scripts/with-api.sh uv run evaluate-relevance"

[tasks.verify]
description = "Run every check, then the acceptance, relevance, interface and Lighthouse suites"
run = [
  "mise run check",
  "mise run acceptance",
  "mise run relevance",
  "mise run ui",
  "mise run lighthouse",
  "mise run audit",
]

[tasks.doctor]
description = "Report the versions of the tools and whether the dataset is ready"
run = "scripts/doctor.sh"

[tasks.clean]
description = "Remove caches, virtual environments, dependency directories and builds"
run = """
find backend tooling -type d \\( -name .venv -o -name __pycache__ -o -name .pytest_cache \
  -o -name .mypy_cache -o -name .ruff_cache -o -name .hypothesis \\) -prune -exec rm -rf {} +
rm -rf frontend/node_modules frontend/dist frontend/coverage
"""
