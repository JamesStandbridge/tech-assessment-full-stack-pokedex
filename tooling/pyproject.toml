[project]
name = "pokedex-tooling"
version = "0.1.0"
description = "Dataset preparation, specification checks, acceptance tests and relevance evaluation for the Pokédex search."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "jsonschema>=4.23",
    "openapi-spec-validator>=0.7",
    "pydantic>=2.9",
    "pytest>=8.3",
    "pytest-bdd>=8.1",
    "pyyaml>=6.0",
    "referencing>=0.35",
]

[project.scripts]
prepare-data = "pokedex_tooling.dataset:main"
validate-specs = "pokedex_tooling.validate_specs:main"
evaluate-relevance = "pokedex_tooling.relevance:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
filterwarnings = [
    "ignore::DeprecationWarning:gherkin.*",
    "ignore:Passing nodeid to _register_fixture is deprecated:pytest.PytestRemovedIn10Warning",
    "ignore:Passing baseid to FixtureDef is deprecated:pytest.PytestRemovedIn10Warning",
]
markers = [
    "should: scenario whose most critical requirement has should priority",
    "could: scenario whose most critical requirement has could priority",
    "requirement(identifier): requirement verified by the scenario",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN", "BLE", "RUF", "PT"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openapi_spec_validator.*"]
ignore_missing_imports = true
